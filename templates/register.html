<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Cartola Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-blue': {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                            950: '#082f49'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite alternate',
                        'float': 'float 6s ease-in-out infinite'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(100%)' },
                            '100%': { transform: 'translateY(0)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-full bg-gradient-to-br from-dark-blue-950 via-dark-blue-900 to-slate-900 text-white">
    <!-- Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-10 text-dark-blue-800/30 text-4xl animate-float">
            <i class="fas fa-futbol"></i>
        </div>
        <div class="absolute top-40 right-16 text-dark-blue-800/20 text-6xl animate-float" style="animation-delay: -2s;">
            <i class="fas fa-futbol"></i>
        </div>
        <div class="absolute bottom-32 left-20 text-dark-blue-800/25 text-5xl animate-float" style="animation-delay: -4s;">
            <i class="fas fa-futbol"></i>
        </div>
        <div class="absolute top-1/4 left-1/4 w-32 h-32 bg-gradient-to-br from-blue-500/10 to-blue-600/10 rounded-full blur-xl animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-48 h-48 bg-gradient-to-br from-purple-500/10 to-purple-600/10 rounded-full blur-2xl animate-pulse" style="animation-delay: -1s;"></div>
    </div>

    <!-- Main Content -->
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10">
        <div class="max-w-md w-full space-y-8">
            <!-- Header -->
            <div class="text-center animate-fade-in">
                <div class="flex justify-center mb-6">
                    <div class="p-4 bg-gradient-to-br from-dark-blue-500 to-dark-blue-600 rounded-2xl shadow-2xl animate-pulse-glow">
                        <i class="fas fa-user-plus text-4xl text-white"></i>
                    </div>
                </div>
                <h1 class="text-4xl font-bold bg-gradient-to-r from-white via-blue-100 to-blue-200 bg-clip-text text-transparent mb-2">
                    Criar Conta
                </h1>
                <p class="text-lg text-dark-blue-200 mb-2">Junte-se ao Cartola Manager</p>
                <p class="text-sm text-dark-blue-300">Comece a dominar sua liga hoje mesmo</p>
            </div>

            <!-- Registration Form -->
            <div class="bg-gradient-to-br from-dark-blue-800/50 to-dark-blue-900/50 backdrop-blur-sm rounded-2xl shadow-2xl border border-dark-blue-700/50 p-8 animate-fade-in">
                <form action="/register" method="post" class="space-y-5" id="registerForm">
                    <!-- Flash Messages -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            <div class="space-y-3 mb-6">
                                {% for category, message in messages %}
                                <div class="animate-fade-in p-4 rounded-lg border-l-4 {% if category == 'error' or category == 'danger' %}bg-red-900/50 border-red-500 text-red-200{% elif category == 'success' %}bg-green-900/50 border-green-500 text-green-200{% else %}bg-blue-900/50 border-blue-500 text-blue-200{% endif %} backdrop-blur-sm shadow-lg">
                                    <div class="flex items-center space-x-2">
                                        <i class="fas {% if category == 'error' or category == 'danger' %}fa-exclamation-triangle{% elif category == 'success' %}fa-check-circle{% else %}fa-info-circle{% endif %}"></i>
                                        <span class="text-sm">{{ message }}</span>
                                    </div>
                                </div>
                                {% endfor %}
                            </div>
                        {% endif %}
                    {% endwith %}

                    <!-- Full Name Field -->
                    <div>
                        <label for="full_name" class="block text-sm font-medium text-dark-blue-200 mb-1.5">
                            <i class="fas fa-id-card text-purple-400 mr-2"></i>Nome Completo
                        </label>
                        <div class="relative">
                            <input type="text" id="full_name" name="full_name" required
                                   class="w-full bg-dark-blue-800/50 border border-dark-blue-600/50 text-white rounded-lg px-4 py-2.5 pl-11 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
                                   placeholder="Seu nome completo">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-signature text-dark-blue-400 text-sm"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Username Field -->
                    <div>
                        <label for="username" class="block text-sm font-medium text-dark-blue-200 mb-1.5">
                            <i class="fas fa-user text-blue-400 mr-2"></i>Usuário
                        </label>
                        <div class="relative">
                            <input type="text" id="username" name="username" required
                                   class="w-full bg-dark-blue-800/50 border border-dark-blue-600/50 text-white rounded-lg px-4 py-2.5 pl-11 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
                                   placeholder="Nome de usuário único">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-at text-dark-blue-400 text-sm"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Email Field -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-dark-blue-200 mb-1.5">
                            <i class="fas fa-envelope text-orange-400 mr-2"></i>E-mail
                        </label>
                        <div class="relative">
                            <input type="email" id="email" name="email" required
                                   class="w-full bg-dark-blue-800/50 border border-dark-blue-600/50 text-white rounded-lg px-4 py-2.5 pl-11 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200"
                                   placeholder="seu@email.com">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-dark-blue-400 text-sm"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-dark-blue-200 mb-1.5">
                            <i class="fas fa-lock text-green-400 mr-2"></i>Senha
                        </label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required
                                   class="w-full bg-dark-blue-800/50 border border-dark-blue-600/50 text-white rounded-lg px-4 py-2.5 pl-11 pr-11 focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-all duration-200"
                                   placeholder="Mínimo 6 caracteres">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-key text-dark-blue-400 text-sm"></i>
                            </div>
                            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-dark-blue-400 hover:text-white transition-colors">
                                <i class="fas fa-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" 
                            class="w-full mt-4 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-semibold py-3 rounded-lg transition-all duration-200 transform hover:scale-[1.02] shadow-lg hover:shadow-xl flex items-center justify-center space-x-2">
                        <i class="fas fa-user-check"></i>
                        <span>Criar Conta Agora</span>
                    </button>
                </form>
            </div>

            <!-- Login Link -->
            <div class="text-center animate-fade-in">
                <p class="text-dark-blue-300">
                    Já tem uma conta? 
                    <a href="/login" class="text-blue-400 hover:text-blue-300 font-medium transition-colors">
                        Faça login aqui
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.getElementById('registerForm').addEventListener('submit', function() {
            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML = '<i class="fas fa-spinner animate-spin mr-2"></i>Processando...';
            btn.disabled = true;
        });
    </script>
</body>
</html>
