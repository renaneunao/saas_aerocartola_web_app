<section class="module-probables-source" data-recalculate="{{ modulo_recalcular_funcao }}" aria-label="Fonte de prováveis">
  <div class="module-probables-source-label">
    <span class="module-probables-source-kicker"><i class="fas fa-signal"></i> Prováveis</span>
    <strong>Fonte</strong>
  </div>
  <div class="module-probables-toggle" role="group" aria-label="Escolher fonte de prováveis">
    <button type="button" data-source="globo" title="Usar prováveis oficiais do Globo / Cartola">
      <img src="{{ url_for('static', filename='img/fonte-provaveis-globo.png') }}" alt="">
      <span>Globo / Cartola</span>
    </button>
    <button type="button" data-source="provaveisdocartola" title="Usar prováveis do site Prováveis do Cartola">
      <img src="{{ url_for('static', filename='img/fonte-provaveis-cartola.png') }}" alt="">
      <span>Prováveis do Cartola</span>
    </button>
  </div>
  <span class="module-probables-source-status" role="status" aria-live="polite"></span>
</section>

<style>
  .module-probables-source {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: .65rem;
    padding: .55rem .75rem .65rem;
    border-bottom: 1px solid rgba(103, 232, 249, .14);
  }
  .module-probables-source-label { margin-right: auto; }
  .module-probables-source-kicker,
  .module-probables-source strong { display: block; }
  .module-probables-source-kicker {
    color: #67e8f9;
    font-size: .56rem;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .module-probables-source-kicker i { margin-right: .35rem; }
  .module-probables-source strong { margin-top: .08rem; color: #f4fbff; font-size: .72rem; }
  .module-probables-toggle { display: inline-flex; align-items: center; gap: .25rem; padding: .18rem; border: 1px solid rgba(103, 232, 249, .18); border-radius: .55rem; background: rgba(2, 12, 23, .54); }
  .module-probables-toggle button { display: inline-flex; align-items: center; gap: .28rem; min-height: 2rem; padding: .25rem .45rem; border: 1px solid transparent; border-radius: .4rem; color: #8ba8ba; background: transparent; cursor: pointer; font-size: .58rem; font-weight: 750; white-space: nowrap; }
  .module-probables-toggle button:hover { color: #e8fbff; background: rgba(103, 232, 249, .08); }
  .module-probables-toggle button.is-selected { border-color: rgba(103, 232, 249, .52); color: #effeff; background: rgba(37, 140, 165, .23); box-shadow: 0 0 0 1px rgba(103, 232, 249, .08); }
  .module-probables-toggle button:disabled { opacity: .58; cursor: wait; }
  .module-probables-toggle img { width: 22px; height: 22px; object-fit: contain; border-radius: .3rem; }
  .module-probables-source-status { min-width: 5rem; color: #7dd3fc; font-size: .55rem; text-align: right; }
  .module-probables-source-status.is-error { color: #fda4af; }
  @media (max-width: 640px) {
    .module-probables-source { align-items: flex-start; flex-wrap: wrap; }
    .module-probables-toggle { flex: 1 1 100%; }
    .module-probables-toggle button { flex: 1 1 0; justify-content: center; }
    .module-probables-source-status { margin-left: auto; }
  }
</style>

<script>
(() => {
  const panel = document.querySelector('.module-probables-source');
  const buttons = [...panel.querySelectorAll('[data-source]')];
  const status = panel.querySelector('.module-probables-source-status');
  if (!panel || !buttons.length) return;

  const setStatus = (message, error = false) => {
    if (!status) return;
    status.textContent = message || '';
    status.classList.toggle('is-error', error);
  };

  const readConfig = async () => {
    const response = await fetch('/api/escalacao-ideal/config', { headers: { Accept: 'application/json' } });
    const config = await response.json();
    if (!response.ok) throw new Error(config.error || 'Não foi possível carregar a configuração.');
    return config;
  };

  const saveSource = async (source) => {
    const config = await readConfig();
    const payload = {
      formation: config.formation || '4-3-3',
      fonte_provaveis: source,
      hack_goleiro: Boolean(config.hack_goleiro),
      fechar_defesa: Boolean(config.fechar_defesa),
      posicao_capitao: config.posicao_capitao || 'atacantes',
      posicao_reserva_luxo: config.posicao_reserva_luxo || 'atacantes',
      prioridades: config.prioridades || 'atacantes,laterais,meias,zagueiros,goleiros,tecnicos'
    };
    const response = await fetch('/api/escalacao-ideal/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Não foi possível salvar a fonte.');
  };

  const setSelected = (source) => buttons.forEach(button => {
    button.classList.toggle('is-selected', button.dataset.source === source);
    button.setAttribute('aria-pressed', button.dataset.source === source ? 'true' : 'false');
  });

  readConfig().then(config => {
    setSelected(config.fonte_provaveis || 'globo');
  }).catch(error => setStatus(error.message, true));

  buttons.forEach(button => button.addEventListener('click', async () => {
    const previous = buttons.find(item => item.classList.contains('is-selected'))?.dataset.source || 'globo';
    const next = button.dataset.source;
    if (next === previous) return;
    buttons.forEach(item => { item.disabled = true; });
    setStatus('Salvando e recalculando…');
    try {
      await saveSource(next);
      setSelected(next);
      setStatus('Fonte atualizada.');
      const recalculate = window[panel.dataset.recalculate];
      if (typeof recalculate === 'function') recalculate();
    } catch (error) {
      setSelected(previous);
      setStatus(error.message, true);
    } finally {
      buttons.forEach(item => { item.disabled = false; });
    }
  }));
})();
</script>
